services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anijinx
      POSTGRES_PASSWORD: anijinx
      POSTGRES_DB: anijinx
    ports:
      - '5432:5432'
    volumes:
      - anijinx-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anijinx']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anijinx-db:
